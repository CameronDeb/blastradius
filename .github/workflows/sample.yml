name: sample
on:
  push:
    branches: [main, dev]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build
        run: docker build --platform linux/amd64 -t br .
      - name: run sample 3x
        run: |
          mkdir -p res
          for i in 1 2 3; do
            /usr/bin/time -f "%e s wall" docker run --rm --platform linux/amd64 --network none --cpus 2 \
              --memory 4096m --memory-swap 4096m --pids-limit 256 --read-only \
              --tmpfs /tmp:rw,size=64m,mode=1777 --cap-drop ALL --security-opt no-new-privileges \
              --user 65534:65534 --env HOME=/tmp \
              -v "$PWD/kit/sample/commits:/data/commits:ro" -v "$PWD/kit/sample/tests.json:/data/tests.json:ro" \
              --entrypoint sh br -c 'python /app/selector.py; echo "cgroup:"; cat /sys/fs/cgroup/cpu.stat' \
              > res/out$i.jsonl 2> res/err$i.log || echo "exit $?" >> res/err$i.log
            grep -v '^{' res/out$i.jsonl > res/cpu$i.txt || true
            grep '^{' res/out$i.jsonl > res/clean$i.jsonl || true
            python3 kit/score.py kit/sample kit/sample/answers.json res/clean$i.jsonl > res/score$i.txt 2>&1 || true
            cat res/score$i.txt res/cpu$i.txt
          done
      - name: run synthetic set
        run: |
          if [ -f mut/CURRENT ]; then
            set=$(cat mut/CURRENT)
            /usr/bin/time -f "%e s wall" docker run --rm --platform linux/amd64 --network none --cpus 2               --memory 4096m --memory-swap 4096m --pids-limit 256 --read-only               --tmpfs /tmp:rw,size=64m,mode=1777 --cap-drop ALL --security-opt no-new-privileges               --user 65534:65534 --env HOME=/tmp               -v "$PWD/mut/$set/commits:/data/commits:ro" -v "$PWD/mut/$set/tests.json:/data/tests.json:ro"               --entrypoint sh br -c 'python /app/selector.py; echo "cgroup:"; cat /sys/fs/cgroup/cpu.stat'               > res/mut.jsonl 2> res/mut_err.log || echo "exit $?" >> res/mut_err.log
            grep -v '^{' res/mut.jsonl > res/mut_cpu.txt || true
            grep '^{' res/mut.jsonl > res/mut_clean.jsonl || true
            python3 kit/score.py mut/$set mut/$set/answers.json res/mut_clean.jsonl > res/mut_score.txt 2>&1 || true
            cat res/mut_score.txt res/mut_cpu.txt
          fi
      - name: publish results
        if: always()
        run: |
          cd res
          git init -q
          git checkout -q -b ci-results
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "results for $GITHUB_SHA"
          git push -fq "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-results
