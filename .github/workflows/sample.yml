name: sample
on:
  push:
    branches: [main, dev]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: build
        run: docker build --platform linux/amd64 -t br .
      - name: run sample 3x
        run: |
          mkdir -p res
          for i in 1 2 3; do
            /usr/bin/time -f "%e s wall" docker run --rm --platform linux/amd64 --network none --cpus 2 \
              --memory 4096m --memory-swap 4096m --pids-limit 256 --read-only \
              --tmpfs /tmp:rw,size=64m,mode=1777 --cap-drop ALL --security-opt no-new-privileges \
              --user 65534:65534 --env HOME=/tmp \
              -v "$PWD/kit/sample/commits:/data/commits:ro" -v "$PWD/kit/sample/tests.json:/data/tests.json:ro" \
              --entrypoint sh br -c 'python /app/selector.py; echo "cgroup:"; cat /sys/fs/cgroup/cpu.stat' \
              > res/out$i.jsonl 2> res/err$i.log || echo "exit $?" >> res/err$i.log
            grep -v '^{' res/out$i.jsonl > res/cpu$i.txt || true
            grep '^{' res/out$i.jsonl > res/clean$i.jsonl || true
            python3 kit/score.py kit/sample kit/sample/answers.json res/clean$i.jsonl > res/score$i.txt 2>&1 || true
            cat res/score$i.txt res/cpu$i.txt
          done
      - name: paired comparison against tools/BASE
        run: |
          if [ -f tools/BASE ]; then
            base=$(cat tools/BASE)
            git worktree add -q /tmp/base "$base"
            docker build -q --platform linux/amd64 -t brbase /tmp/base > /dev/null
            for r in 1 2 3; do
              for img in brbase br; do
                docker run --rm --platform linux/amd64 --network none --cpus 2                   --memory 4096m --memory-swap 4096m --pids-limit 256 --read-only                   --tmpfs /tmp:rw,size=64m,mode=1777 --cap-drop ALL --security-opt no-new-privileges                   --user 65534:65534 --env HOME=/tmp                   -v "$PWD/kit/sample/commits:/data/commits:ro" -v "$PWD/kit/sample/tests.json:/data/tests.json:ro"                   --entrypoint sh $img -c 'python /app/selector.py; echo "cgroup:"; cat /sys/fs/cgroup/cpu.stat'                   > res/pair_$img.jsonl 2>/dev/null || true
                cpu=$(grep usage_usec res/pair_$img.jsonl | awk '{print $2/1e6}')
                grep '^{' res/pair_$img.jsonl > res/pair_${img}_clean.jsonl
                sim=$(python3 kit/score.py kit/sample kit/sample/answers.json res/pair_${img}_clean.jsonl 2>&1 | grep Simulated | awk '{print $2}')
                echo "$img run$r sim=$sim cpu=$cpu" | tee -a res/pair.txt
              done
            done
          fi
      - name: run synthetic sets
        run: |
          if [ -f mut/CURRENT ]; then
            for set in $(cat mut/CURRENT); do
              docker run --rm --platform linux/amd64 --network none --cpus 2                 --memory 4096m --memory-swap 4096m --pids-limit 256 --read-only                 --tmpfs /tmp:rw,size=64m,mode=1777 --cap-drop ALL --security-opt no-new-privileges                 --user 65534:65534 --env HOME=/tmp                 -v "$PWD/mut/$set/commits:/data/commits:ro" -v "$PWD/mut/$set/tests.json:/data/tests.json:ro"                 --entrypoint sh br -c 'python /app/selector.py; echo "cgroup:"; cat /sys/fs/cgroup/cpu.stat'                 > res/$set.jsonl 2> res/${set}_err.log || echo "exit $?" >> res/${set}_err.log
              grep -v '^{' res/$set.jsonl > res/${set}_cpu.txt || true
              grep '^{' res/$set.jsonl > res/${set}_clean.jsonl || true
              python3 kit/score.py mut/$set mut/$set/answers.json res/${set}_clean.jsonl > res/${set}_score.txt 2>&1 || true
              echo "== $set"; cat res/${set}_score.txt res/${set}_cpu.txt
            done
          fi
      - name: measure per-test cpu
        run: |
          if [ -f tools/MEASURE ]; then
            docker run --rm --platform linux/amd64 --network none --cpus 2 --memory 4096m --pids-limit 256               --read-only --tmpfs /tmp:rw,size=64m,mode=1777 --user 65534:65534 --env HOME=/tmp               -v "$PWD/kit/sample/commits:/data/commits:ro" -v "$PWD/kit/sample/tests.json:/data/tests.json:ro"               -v "$PWD/tools/measure_cpu.py:/app/measure_cpu.py:ro"               br python /app/measure_cpu.py > res/cpu_measure.json 2> res/cpu_measure.log || true
            tail -5 res/cpu_measure.log
          fi
      - name: publish results
        if: always()
        run: |
          cd res
          git init -q
          git checkout -q -b "ci-results-$GITHUB_REF_NAME"
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "results for $GITHUB_SHA"
          git push -fq "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" "ci-results-$GITHUB_REF_NAME"
